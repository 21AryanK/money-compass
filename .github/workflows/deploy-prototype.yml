name: Deploy prototype to GitHub Pages

# Publishes the static frontend prototype in prototype/ — not the Angular
# app in frontend/, and not the Spring Boot backend — to GitHub Pages.
# It is a single self-contained index.html: no build step required.

on:
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - ".github/workflows/deploy-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype
      - id: deployment
        uses: actions/deploy-pages@v4
