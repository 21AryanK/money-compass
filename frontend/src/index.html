<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Money Compass</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An adaptive financial-literacy assessment for Indian retail investors — a deterministic score, an AI-written explanation, a risk profile, and an investment plan that splits your money across FDs, mutual funds, direct equity and gold.">
  <meta name="theme-color" content="#0a1210">
  <!-- Applies the saved theme before first paint, so there's no flash of the wrong one. -->
  <script>try { document.documentElement.setAttribute("data-theme", localStorage.getItem("money-compass-theme") === "light" ? "light" : "dark"); } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

</html>
