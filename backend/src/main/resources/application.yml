# Base configuration. Profile-specific overrides live in
# application-local.yml and application-prod.yml.
#
# Every externally variable value below is a ${PLACEHOLDER} resolved from
# infra/.env. There is nothing to edit in this file to point the app at a
# different database, model, or provider.

spring:
  application:
    name: money-compass

  # Loads infra/.env as a property source so `./mvnw spring-boot:run` sees the
  # same values docker compose does. `optional:` means a missing file is not an
  # error, which is what you want in a container where the values arrive as real
  # environment variables instead. The [.properties] suffix tells Spring to
  # parse the extensionless file using the properties format.
  config:
    import: "optional:file:../infra/.env[.properties]"

  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    # Flyway owns the schema. Hibernate must never alter it, or the migration
    # history and the live schema drift apart silently.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # -------------------------------------------------------------------------
  # Spring AI. The ollama starter is on the classpath from Phase 3 onward, so
  # this section is live: Spring Boot autoconfigures a single OllamaChatModel
  # bean from it, which ChatClientConfig wraps in a ChatClient. AI_TEMPERATURE
  # and AI_MAX_TOKENS are the same two knobs docs/configuration.md promises
  # apply to every provider, so they are set here rather than hardcoded.
  #
  # The openai and bedrock blocks stay inert placeholders: their starters are
  # not yet dependencies (Phase 5, `prod` profile), so nothing auto-configures
  # against them, but the property shape is already verified against the
  # Spring AI 2.0 reference docs so Phase 5 is a dependency addition plus one
  # branch in ResilientChatClient.resolveClient, not a redesign.
  # -------------------------------------------------------------------------
  ai:
    # Spring AI retries every model call itself (10 attempts, backing off up
    # to 3 minutes) unless told otherwise. ResilientChatClient already retries
    # through Resilience4j and then falls back, so the two layers nested made
    # an unreachable model take many minutes to fail instead of seconds.
    # Resilience4j is the one retry layer; this one is switched off.
    retry:
      max-attempts: 1
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.1:8b}
          temperature: ${AI_TEMPERATURE:0.2}
          num-predict: ${AI_MAX_TOKENS:800}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
      converse:
        chat:
          options:
            model: ${BEDROCK_MODEL:meta.llama3-1-8b-instruct-v1:0}

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: money-compass

# ---------------------------------------------------------------------------
# Application settings. Bound to MoneyCompassProperties, which validates them
# at startup so a bad value fails fast instead of at first request.
# ---------------------------------------------------------------------------
moneycompass:
  ai:
    primary: ${AI_PRIMARY:ollama}
    fallback: ${AI_FALLBACK:none}
    temperature: ${AI_TEMPERATURE:0.2}
    max-tokens: ${AI_MAX_TOKENS:800}
  questionnaire:
    max-questions: ${QUESTIONNAIRE_MAX_QUESTIONS:30}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-ttl-hours: ${JWT_TTL_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------------------------------------------------------------------------
# Resilience4j. ResilientChatClient decorates each provider call with one
# circuit breaker and one retry, looked up here by name ("ai-primary" /
# "ai-fallback"). Two named instances rather than one shared instance so that
# a struggling primary cannot trip the breaker that protects the fallback.
# ---------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    instances:
      ai-primary:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      ai-fallback:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      ai-primary:
        max-attempts: 2
        wait-duration: 500ms
      ai-fallback:
        max-attempts: 2
        wait-duration: 500ms

logging:
  level:
    com.moneycompass: INFO
